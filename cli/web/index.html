<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITEL}}</title>
<style>
  :root { color-scheme: light dark; --akzent: #f5b800; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2.5rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .4rem .9rem; border-radius: .5rem; border: 1px solid #8884; background: var(--akzent); color: #111; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  input { font: inherit; padding: .4rem .6rem; border-radius: .5rem; border: 1px solid #8886; }
  li { margin: .35rem 0; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { start } from './volt.js';
  start('app.wasm').catch((e) => { document.getElementById('app').textContent = 'Fehler: ' + e.message; console.error(e); });
  // Live-Reload für `volt serve` (bei statischem Hosting gibt es /__stamp nicht – dann passiert nichts)
  let stamp = null;
  setInterval(async () => {
    try { const r = await fetch('/__stamp', { cache: 'no-store' }); if (!r.ok) return; const t = await r.text();
      if (stamp !== null && t !== stamp) location.reload(); stamp = t; } catch {}
  }, 600);
</script>
</body>
</html>
